# Fly.io configuration for JavaFX PR preview application
# This is a template - actual app name will be set dynamically in GitHub Actions

app = "fxplanner-preview-pr-PLACEHOLDER"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  JPRO_PORT = "8080"
  JAVA_OPTS = "-Xmx512m"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "60s"
    method = "GET"
    path = "/"

[[services]]
  protocol = "tcp"
  internal_port = 8080

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  [[services.tcp_checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "60s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
