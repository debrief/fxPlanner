plugins {
    id 'java'
    id 'application'
    // JPro Gradle plugin for web deployment
    id 'one.jpro' version '2025.1.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'com.planetmayo.fxplanner.HelloWorldApp'
}

repositories {
    mavenCentral()
    // JPro repository for plugin and runtime dependencies
    maven { url = uri('https://sandec.jfrog.io/artifactory/repo') }
}

dependencies {
    // Align with pom.xml
    def javafxVersion = '21.0.1'
    implementation "org.openjfx:javafx-controls:${javafxVersion}"
    implementation "org.openjfx:javafx-fxml:${javafxVersion}"
    implementation "org.openjfx:javafx-web:${javafxVersion}"
    implementation "org.openjfx:javafx-media:${javafxVersion}"

    // JPro runtime/client - using 2024.4.0 (latest available on Maven Central)
    implementation "com.sandec.jpro:jpro-webapi:2024.4.0"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// JPro configuration
jpro {
    port = 8080
    // Use the same main class as Maven
    mainClassName = 'com.planetmayo.fxplanner.HelloWorldApp'
}

tasks.register('printRunHint') {
    group = 'help'
    description = 'Prints how to run the app with Gradle.'
    doLast {
        println '\nTry:\n  ./gradlew run      (desktop JavaFX)\n  ./gradlew jproRun  (JPro web server)\n'
    }
}
