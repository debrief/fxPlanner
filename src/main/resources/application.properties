# Spring Boot Configuration for USV Mission Planner Web API

# Server Configuration
server.port=8080

# Logging Configuration
logging.level.root=INFO
logging.level.com.planetmayo.usvsim=DEBUG
logging.level.org.springframework=INFO

# CORS Configuration (allow frontend development server)
# Handled programmatically in controllers

# Static Resource Configuration
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.add-mappings=true

# Application Info
spring.application.name=usv-mission-planner-api
