# Server Configuration
server.port=${PORT:8080}
server.compression.enabled=true

# Application Info
spring.application.name=usv-mission-planner-api
info.app.name=USV Mission Planner API
info.app.version=1.0.0

# JSON Configuration
spring.jackson.serialization.indent-output=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# CORS Configuration (development - will be configured in WebConfig)
# Production uses embedded frontend, no CORS needed

# Static Resources (embedded frontend)
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# Logging
logging.level.root=INFO
logging.level.com.planetmayo.usvsim=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# SpringDoc OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
